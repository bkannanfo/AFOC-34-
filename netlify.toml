[build]
  command = "npm run build"
  publish = "dist"

# Note : la suppression du slash final est gérée nativement par Netlify
# (les fichiers .html générés par build.format:'file' sont servis sur /page,
# et /page/ est redirigé automatiquement en 301). Pas de règle custom ici :
# une règle "/:a/" -> "/:a" boucle car Netlify ignore le slash final dans `from`.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://umami-five-zeta.vercel.app; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://umami-five-zeta.vercel.app; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.github.com https://www.githubstatus.com blob:; frame-ancestors 'none';"

# Pages de confirmation post-formulaire : hors index (doublon du <meta robots>).
[[headers]]
  for = "/merci-contact"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/success"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Anciennes adresses avec accents : redirigées vers les adresses sans accent.
[[redirects]]
  from = "/logement/élections-hlm-le-vote-est-ouvert-votez-pour-la-liste-afoc"
  to = "/logement/elections-hlm-le-vote-est-ouvert-votez-pour-la-liste-afoc"
  status = 301
  force = true

[[redirects]]
  from = "/logement/%C3%A9lections-hlm-le-vote-est-ouvert-votez-pour-la-liste-afoc"
  to = "/logement/elections-hlm-le-vote-est-ouvert-votez-pour-la-liste-afoc"
  status = 301
  force = true

[[redirects]]
  from = "/consommation/black-friday-les-conseils-de-lafoc-pour-éviter-les-faux-rabais-ou-arnaques"
  to = "/consommation/black-friday-conseils-afoc-faux-rabais-et-arnaques"
  status = 301
  force = true

[[redirects]]
  from = "/consommation/black-friday-les-conseils-de-lafoc-pour-%C3%A9viter-les-faux-rabais-ou-arnaques"
  to = "/consommation/black-friday-conseils-afoc-faux-rabais-et-arnaques"
  status = 301
  force = true
